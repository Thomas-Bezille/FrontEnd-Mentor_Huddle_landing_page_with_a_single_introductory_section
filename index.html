<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./docs/images/favicon-32x32.png" />
    <link rel="stylesheet" href="css/style.css" />
    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#"
        ><img src="./docs/images/logo.svg" alt="Logo Huddle" class="logo" />
      </a>
    </header>

    <main>
      <div class="img-container">
        <img
          src="./docs/images/illustration-mockups.svg"
          alt="Illustration mockups" />
      </div>

      <div class="text-container">
        <h1>
          Build The Community
          <br />
          Your Fans Will Love
        </h1>
        <p>
          Huddle re-imagines the way we build communities. You have a voice, but
          so does your audience. Create connections with your users as you
          engage in genuine discussion.
        </p>
        <button>Register</button>
      </div>
    </main>

    <footer>
      <a href="#" class="social-link"
        ><ion-icon name="logo-facebook"></ion-icon
      ></a>
      <a href="#" class="social-link"
        ><ion-icon name="logo-twitter"></ion-icon
      ></a>
      <a href="#" class="social-link"
        ><ion-icon name="logo-instagram"></ion-icon
      ></a>
    </footer>

    <div class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io/challenges/huddle-landing-page-with-a-single-introductory-section-B_2Wvxgi0"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://github.com/Thomas-Bezille/">Thomas Bezille</a>.
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
